name: CommonsBase_Remote@0.2.x
on:
  push:
    tags:
      - '0.2.*'
  workflow_dispatch:

jobs:
  distribute:
    environment: dk-distribution
    runs-on: ubuntu-latest

    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@f808768d1510423e83855289c910610ca9b43176
        with: { egress-policy: audit }

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Distribute Modules
        uses: diskuv/dk-distribute@v3
        with:
            pubkey: ${{ secrets.distribute_0_2_pubkey }}
            seckey: ${{ secrets.distribute_0_2_seckey }}
            options: -nosysinc
            store: release
            standalone: true
            distscript: dist/any.u
            execution-abi: Linux_x86_64
            target-abi: Linux_x86_64
            experimental-mlfront-ref: ${{ github.ref_type != 'tag' && 'HEAD' }}

      - name: Attest
        id: attest
        uses: actions/attest-build-provenance@v3
        with: { subject-path: dk-dist/* }

      # Publish the sigstore bundle beside values.json so a consumer fetches it
      # with a plain download and needs no GitHub API token. Two things here are
      # load-bearing:
      #
      # The bytes come from `gh attestation download`, NOT from
      # steps.attest.outputs.bundle-path. A consumer re-serializes each bundle
      # line into the values.json it imports, preserving member order, so the
      # asset has to be byte-identical to what the API serves; gh writes
      # protojson and the action's own output does not order members the same
      # way. Publishing the wrong one changes what every consumer imports.
      #
      # It is staged outside dk-dist/, which both `subject-path` and `files`
      # glob, so the attest step can never be handed its own output.
      - name: Stage the attestation bundle
        env:
            GH_TOKEN: ${{ github.token }}
        run: |
            set -eu
            mkdir -p dk-attest
            n=0
            until gh attestation download dk-dist/values.json -R "$GITHUB_REPOSITORY"; do
              n=$((n + 1))
              if [ "$n" -ge 5 ]; then exit 1; fi
              sleep 5
            done
            digest=$(sha256sum dk-dist/values.json | cut -d' ' -f1)
            mv "sha256:$digest.jsonl" dk-attest/values.json.sigstore.jsonl

      - name: Release
        uses: softprops/action-gh-release@153bb8e04406b158c6c84fc1615b65b24149a1fe
        with:
            files: |
                dk-dist/*
                dk-attest/values.json.sigstore.jsonl
            body_path: ".dist-CHANGELOG.txt"
