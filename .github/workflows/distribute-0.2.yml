name: CommonsBase_Remote@0.2.x
on:
  push:
    tags:
      - '0.2.*'
  workflow_dispatch:

jobs:
  distribute:
    environment: dk-distribution
    runs-on: ubuntu-latest
    # Linux builds run in the manylinux glibc 2.28 container for broad
    # release compatibility (matches the other dk package distribute
    # workflows, for example CommonsBase_Build).
    container:
      image: quay.io/pypa/manylinux_2_28_x86_64:2026.04.08-5 # glibc 2.28 + gcc 14.2.1: old glibc is highly compatible and works with Node v24.14.0; system gcc will not be needed once GCC bootstrapped in dk0.

    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@f808768d1510423e83855289c910610ca9b43176
        with: { egress-policy: audit }

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Distribute Modules
        uses: diskuv/dk-distribute@v4
        with:
            pubkey: ${{ secrets.distribute_0_2_pubkey }}
            seckey: ${{ secrets.distribute_0_2_seckey }}
            options: -nosysinc
            store: release
            standalone: true
            distscript: dist/any.u
            execution-abi: Linux_x86_64
            target-abi: Linux_x86_64
            experimental-mlfront-ref: ${{ github.ref_type != 'tag' && 'HEAD' }}

      # Attests the distribution, publishes the sigstore bundle for values.json
      # as a release asset, and creates the release. A consumer then fetches
      # that bundle beside values.json with a plain download, so importing this
      # release needs no GitHub API token.
      - name: Attest and Release
        uses: diskuv/dk-distribute/attest-release@v4
